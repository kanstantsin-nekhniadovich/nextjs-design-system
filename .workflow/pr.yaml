name: PR workflow

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup NodeJs
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0

      - name: Install
        run: npm ci

      - name: Lint & Compile
        run: |
          npm lint
          npm run compile

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

